<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP yang berlaku sesungguhnya. Header CSP ditimpa LiteSpeed di hosting
         ini; alasan lengkapnya di server/lib/middleware.ts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn-uicons.flaticon.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com https://*.r2.cloudflarestorage.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'"
    />
    <meta name="description" content="Tracking Lamaran — catat, lacak, dan menangkan setiap lamaran kerja dalam satu tempat yang tenang." />
    <link rel="canonical" href="https://trackinglamaran.site/" />
    <title>Tracking Lamaran — Pelacak Lamaran Kerja</title>

    <!--
      Meta di bawah ini TIDAK mengubah apa yang dilihat pengguna. Alasannya:
      React menggambar seluruh halaman SETELAH JavaScript jalan, jadi mesin
      pencari dan verifikator otomatis yang tidak menjalankan JavaScript
      (termasuk pemeriksa layar persetujuan Google) hanya melihat <div
      id="root"></div> kosong — tanpa nama aplikasi, tanpa penjelasan apa pun.
      Blok ini mengisi itu: nama dan tujuan aplikasi, dibaca langsung dari HTML
      mentah tanpa perlu JavaScript.

      "Tracking Lamaran" sengaja dipakai sebagai nama utama di sini, sama
      persis dengan nama aplikasi di layar persetujuan Google — bukan "Job
      Tracker" yang muncul kalau bahasa pengguna Inggris. Halaman ini hanya
      punya satu identitas tetap; yang berganti bahasa cuma isi aplikasinya.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tracking Lamaran" />
    <meta property="og:url" content="https://trackinglamaran.site/" />
    <meta property="og:title" content="Tracking Lamaran — Pelacak Lamaran Kerja" />
    <meta
      property="og:description"
      content="Catat, lacak, dan menangkan setiap lamaran kerja dalam satu tempat yang tenang. Gratis, tanpa iklan, di-hosting sendiri."
    />
    <meta property="og:image" content="https://trackinglamaran.site/logo.png" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tracking Lamaran — Pelacak Lamaran Kerja" />
    <meta
      name="twitter:description"
      content="Catat, lacak, dan menangkan setiap lamaran kerja dalam satu tempat yang tenang."
    />
    <meta name="twitter:image" content="https://trackinglamaran.site/logo.png" />

    <!--
      Data terstruktur schema.org. Bukan dekorasi: ini yang dibaca mesin
      pencari dan mesin jawaban berbasis AI (AI Overviews Google, Perplexity,
      ChatGPT dengan penelusuran) untuk tahu APA aplikasi ini tanpa harus
      menebak dari potongan teks. type="application/ld+json" tidak pernah
      dieksekusi sebagai skrip oleh peramban — inert, murni data — sehingga
      tidak melanggar script-src di atas; dibuktikan tanpa galat CSP di
      konsol saat halaman dimuat.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tracking Lamaran",
        "alternateName": "Job Tracker",
        "url": "https://trackinglamaran.site/",
        "description": "Pelacak lamaran kerja gratis dan tanpa iklan. Mencatat lamaran, tahap seleksi, jadwal interview, dan dokumen CV dalam satu tempat.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": ["id", "en"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "IDR"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Flaticon: origin paling mahal di halaman ini menurut PageSpeed Insights
         (satu berkas font ikonnya sendiri 428 KB, mendominasi jalur render
         kritis). Belum pernah di-preconnect sebelumnya — Google Fonts sudah,
         Flaticon belum, padahal Flaticon yang lebih berat. -->
    <link rel="preconnect" href="https://cdn-uicons.flaticon.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!--
      Dua CSS Flaticon ini dulu <link rel="stylesheet"> biasa — memblokir render
      2.780 md dari 3.510 md total (data PageSpeed Insights, mobile). media="print"
      membuat peramban TIDAK menunggunya untuk menggambar layar, tapi tetap
      mengunduhnya di latar belakang; defer-icon-css.js mengaktifkannya begitu
      HTML selesai di-parse.

      Skrip eksternal, bukan atribut onload inline — CSP di atas TIDAK memuat
      'unsafe-inline' di script-src, jadi onload="..." inline akan dibisukan CSP
      tanpa galat sama sekali dan ikon tidak akan pernah muncul di layar biasa.
      src="/defer-icon-css.js" sah di bawah script-src 'self' tanpa mengubah CSP
      sedikit pun.

      Konsekuensi yang disadari: ikon bisa tampil tanpa gaya sepersekian detik
      di pemuatan pertama sebelum CSS-nya aktif — pertukaran yang jauh lebih
      baik daripada memblokir seluruh halaman untuk itu.
    -->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
      media="print"
      data-defer-swap
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded/css/uicons-solid-rounded.css"
      media="print"
      data-defer-swap
    />
    <script src="/defer-icon-css.js" defer></script>
</head>
  <body>
    <div id="root"></div>
    <!--
      Hanya muncul kalau JavaScript MATI atau belum sempat jalan — misalnya di
      mata pemeriksa otomatis, mesin pencari, atau crawler AI. Pengguna
      sungguhan dengan JavaScript aktif tidak pernah melihat blok ini; React
      langsung menimpanya. Isinya jujur — persis apa yang dijelaskan aplikasi
      sendiri setelah dimuat, bukan teks yang berbeda untuk "menipu" pemeriksa.
    -->
    <noscript>
      <div style="max-width:640px;margin:64px auto;padding:0 24px;font-family:system-ui,sans-serif;line-height:1.7;color:#23211d">
        <h1>Tracking Lamaran</h1>
        <p>
          Pelacak lamaran kerja gratis dan tanpa iklan, di-hosting sendiri. Catat, lacak, dan
          kelola setiap lamaran kerja Anda — dari niat melamar sampai diterima — lengkap dengan
          pengingat interview, tenggat lowongan, dan penyimpanan dokumen CV.
        </p>
        <p>
          Masuk dengan akun Google. Aplikasi ini hanya meminta nama, alamat email, dan foto
          profil Anda untuk membuat akun — tidak ada akses ke email, kontak, kalender, atau
          Drive Anda.
        </p>
        <p>
          Halaman ini butuh JavaScript untuk berjalan. Aktifkan JavaScript di peramban Anda,
          atau baca <a href="/privasi.html">kebijakan privasi</a> dan
          <a href="/syarat.html">syarat &amp; ketentuan</a> kami.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
