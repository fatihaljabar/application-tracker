<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP yang berlaku sesungguhnya. Header CSP ditimpa LiteSpeed di hosting
         ini; alasan lengkapnya di server/lib/middleware.ts.

         style-src TIDAK memuat fonts.googleapis.com di sini — dokumen ini tidak
         pernah lagi mengambil apa pun dari origin itu (CSS Google Fonts sudah
         ditempel langsung, lihat <style> di bawah). middleware.ts sengaja TETAP
         memuatnya di header global, karena privacy.html/terms.html/dst. masih
         memakai <link rel="stylesheet"> biasa ke origin itu. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://cdn-uicons.flaticon.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com https://cdn-uicons.flaticon.com; img-src 'self' data: https://lh3.googleusercontent.com; connect-src 'self' https://accounts.google.com https://*.r2.cloudflarestorage.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'"
    />
    <meta name="description" content="Tracking Lamaran — catat, lacak, dan menangkan setiap lamaran kerja dalam satu tempat yang tenang." />
    <link rel="canonical" href="https://trackinglamaran.site/" />
    <title>Tracking Lamaran — Pelacak Lamaran Kerja</title>

    <!--
      Meta di bawah ini TIDAK mengubah apa yang dilihat pengguna. Alasannya:
      React menggambar seluruh halaman SETELAH JavaScript jalan, jadi mesin
      pencari dan verifikator otomatis yang tidak menjalankan JavaScript
      (termasuk pemeriksa layar persetujuan Google) hanya melihat <div
      id="root"></div> kosong — tanpa nama aplikasi, tanpa penjelasan apa pun.
      Blok ini mengisi itu: nama dan tujuan aplikasi, dibaca langsung dari HTML
      mentah tanpa perlu JavaScript.

      "Tracking Lamaran" sengaja dipakai sebagai nama utama di sini, sama
      persis dengan nama aplikasi di layar persetujuan Google — bukan "Job
      Tracker" yang muncul kalau bahasa pengguna Inggris. Halaman ini hanya
      punya satu identitas tetap; yang berganti bahasa cuma isi aplikasinya.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tracking Lamaran" />
    <meta property="og:url" content="https://trackinglamaran.site/" />
    <meta property="og:title" content="Tracking Lamaran — Pelacak Lamaran Kerja" />
    <meta
      property="og:description"
      content="Catat, lacak, dan menangkan setiap lamaran kerja dalam satu tempat yang tenang. Gratis, tanpa iklan, di-hosting sendiri."
    />
    <meta property="og:image" content="https://trackinglamaran.site/logo.png" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tracking Lamaran — Pelacak Lamaran Kerja" />
    <meta
      name="twitter:description"
      content="Catat, lacak, dan menangkan setiap lamaran kerja dalam satu tempat yang tenang."
    />
    <meta name="twitter:image" content="https://trackinglamaran.site/logo.png" />

    <!--
      Data terstruktur schema.org. Bukan dekorasi: ini yang dibaca mesin
      pencari dan mesin jawaban berbasis AI (AI Overviews Google, Perplexity,
      ChatGPT dengan penelusuran) untuk tahu APA aplikasi ini tanpa harus
      menebak dari potongan teks. type="application/ld+json" tidak pernah
      dieksekusi sebagai skrip oleh peramban — inert, murni data — sehingga
      tidak melanggar script-src di atas; dibuktikan tanpa galat CSP di
      konsol saat halaman dimuat.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Tracking Lamaran",
        "alternateName": "Job Tracker",
        "url": "https://trackinglamaran.site/",
        "description": "Pelacak lamaran kerja gratis dan tanpa iklan. Mencatat lamaran, tahap seleksi, jadwal interview, dan dokumen CV dalam satu tempat.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": ["id", "en"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "IDR"
        }
      }
    </script>

    <!-- fonts.googleapis.com TIDAK di-preconnect: CSS-nya sudah ditempel langsung
         di <style> di bawah, jadi tidak ada permintaan ke origin itu sama sekali
         lagi. Preconnect ke origin yang tidak pernah dihubungi cuma sia-sia. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      crossorigin pada preconnect HARUS sama persis dengan cara resource-nya
      diambil — kalau tidak, peramban menganggapnya koneksi berbeda dan
      preconnect-nya sia-sia (dikonfirmasi PageSpeed Insights: "prakoneksi
      tidak digunakan" untuk accounts.google.com sebelum baris ini diperbaiki).

      Flaticon menyajikan DUA jenis resource sekaligus: CSS-nya sendiri (diambil
      tanpa crossorigin, sama seperti <link rel="stylesheet"> biasa) dan berkas
      font DI DALAM CSS itu (font lintas-origin SELALU diambil dengan
      crossorigin — aturan peramban, bukan pilihan kita). Satu tag preconnect
      cuma mewakili satu jenis, jadi dua baris di sini masing-masing untuk
      satu jenis, sesuai pola resmi web.dev untuk origin yang menyajikan
      keduanya.
    -->
    <link rel="preconnect" href="https://cdn-uicons.flaticon.com" crossorigin />
    <link rel="preconnect" href="https://cdn-uicons.flaticon.com" />
    <!-- accounts.google.com SENGAJA tidak di-preconnect: PageSpeed Insights mulai
         menandai "lebih dari 4 koneksi preconnect" begitu baris ini ditambah
         (bersama 2 baris Flaticon + 2 baris fonts.g*, jadi 5). Skrip GSI dimuat
         lewat useEffect di Login.tsx — ditunda, bukan bagian jalur render kritis
         LCP — jadi preconnect di sini tidak membantu skor, cuma menghabiskan
         satu dari sedikit slot preconnect yang direkomendasikan. -->
    <link
      rel="preload"
      as="image"
      href="/logo.png"
      fetchpriority="high"
    />
    <!-- Elemen LCP di halaman masuk adalah logo ini (dikonfirmasi PageSpeed
         Insights), tapi HTML mentah cuma <div id="root"></div> — <img>-nya baru
         ADA di DOM setelah React merender, jadi peramban baru tahu perlu
         mengunduhnya setelah JS selesai jalan (2.640 md "penundaan pemuatan
         resource" di breakdown LCP). Preload ini membuat peramban mulai
         mengunduhnya dari HTML mentah, sejajar dengan resource lain, tanpa
         menunggu JS. Dipakai juga di Layout.tsx (sidebar & header setelah
         login), jadi tidak pernah sia-sia siapa pun yang membuka aplikasi. -->

         fonts.googleapis.com — menghilangkan satu bolak-balik jaringan penuh

         fonts.gstatic.com seperti biasa, tidak di-hosting sendiri — cuma daftar
         @font-face-nya yang sekarang statis di sini, bukan hasil fetch.

         Ditempel APA ADANYA dari respons asli, family & weight yang sama persis
         dengan yang sebelumnya diminta lewat URL di bawah ini — tidak ada yang
         dipangkas. Diambil dengan:
         curl -A "<UA Chrome modern>" "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"

      HTML selesai di-parse.

      Skrip eksternal, bukan atribut onload inline — CSP di atas TIDAK memuat
      'unsafe-inline' di script-src, jadi onload="..." inline akan dibisukan CSP
      tanpa galat sama sekali dan ikon tidak akan pernah muncul di layar biasa.
      src="/defer-icon-css.js" sah di bawah script-src 'self' tanpa mengubah CSP
      sedikit pun.

      Konsekuensi yang disadari: ikon bisa tampil tanpa gaya sepersekian detik
      di pemuatan pertama sebelum CSS-nya aktif — pertukaran yang jauh lebih
      baik daripada memblokir seluruh halaman untuk itu.

    <link
